services:
  - type: web
    name: c2f-catalogue
    runtime: node
    plan: free
    rootDir: server
    buildCommand: npm install && npm run seed
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: 22.5.0
      - key: GMAIL_USER
        sync: false
      - key: GMAIL_APP_PASSWORD
        sync: false
      - key: CONTACT_NOTIFY_EMAIL
        sync: false
