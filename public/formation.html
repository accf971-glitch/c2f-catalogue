<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Formation - C2F</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <header class="site-header">
    <div class="header-top">
      <a class="logo" href="index.html">
        <img class="logo-mark" src="assets/LOGO.jpg" alt="C2F - Coach Consultant Formateur" />
        <span class="tagline">Se former pour se transformer</span>
      </a>
      <div class="header-contact">
        <div><a href="mailto:carinefontenelle@c2f-antilles.com">carinefontenelle@c2f-antilles.com</a></div>
        <div>0690 76 61 88</div>
      </div>
    </div>
  </header>

  <div class="breadcrumb">
    <a href="index.html">← Retour au catalogue</a>
  </div>

  <main class="formation-detail" id="formationDetail">
    <!-- rempli par formation.js -->
  </main>

  <footer class="site-footer">
    <div class="footer-inner">
      <div>
        <div class="tagline">SE FORMER POUR SE TRANSFORMER</div>
        <div>C2F Antilles - Baie-Mahault, Guadeloupe</div>
      </div>
      <div>
        <div>Carine Fontenelle</div>
        <div><a href="mailto:carinefontenelle@c2f-antilles.com">carinefontenelle@c2f-antilles.com</a></div>
        <div>0690 76 61 88</div>
      </div>
    </div>
  </footer>

  <div class="modal-overlay hidden" id="contactModal">
    <div class="modal-box">
      <button class="modal-close" id="closeModal" aria-label="Fermer">&times;</button>
      <h3>Demande d'information</h3>
      <p id="modalFormationTitle" style="color:#5c6b70; font-size:14px;"></p>
      <form id="contactForm">
        <div class="form-field">
          <label for="nom">Nom complet *</label>
          <input type="text" id="nom" name="nom" required />
        </div>
        <div class="form-field">
          <label for="email">Email *</label>
          <input type="email" id="email" name="email" required />
        </div>
        <div class="form-field">
          <label for="telephone">Téléphone</label>
          <input type="tel" id="telephone" name="telephone" />
        </div>
        <div class="form-field">
          <label for="message">Message</label>
          <textarea id="message" name="message" placeholder="Précisez votre demande, vos disponibilités..."></textarea>
        </div>
        <button type="submit" class="cta-button">Envoyer ma demande</button>
        <div class="form-status" id="formStatus"></div>
      </form>
    </div>
  </div>

  <div class="modal-overlay hidden" id="devisModal">
    <div class="modal-box">
      <button class="modal-close" id="closeDevisModal" aria-label="Fermer">&times;</button>
      <h3>Demande de devis</h3>
      <p id="devisFormationTitle" style="color:#5c6b70; font-size:14px;"></p>
      <form id="devisForm">
        <div class="form-field">
          <label for="devisNom">Nom complet *</label>
          <input type="text" id="devisNom" name="nom" required />
        </div>
        <div class="form-field">
          <label for="devisEmail">Email *</label>
          <input type="email" id="devisEmail" name="email" required />
        </div>
        <div class="form-field">
          <label for="devisTelephone">Téléphone</label>
          <input type="tel" id="devisTelephone" name="telephone" />
        </div>
        <div class="form-field">
          <label for="devisSociete">Société (optionnel)</label>
          <input type="text" id="devisSociete" name="societe" />
        </div>
        <div class="form-field">
          <label for="devisParticipants">Nombre de participants</label>
          <input type="number" id="devisParticipants" name="participants" min="1" value="1" />
        </div>
        <div class="form-field">
          <label for="devisMessage">Message (optionnel)</label>
          <textarea id="devisMessage" name="message" placeholder="Précisions utiles pour votre devis..."></textarea>
        </div>
        <p id="devisEstimation" style="font-weight:600; color:var(--accent-dark);"></p>
        <button type="submit" class="cta-button">Demander mon devis</button>
        <div class="form-status" id="devisStatus"></div>
      </form>
    </div>
  </div>

  <script src="js/formation.js"></script>
</body>
</html>
